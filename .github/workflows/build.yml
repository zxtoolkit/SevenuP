name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Not applied to release runs: a push must not kill a build that is publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  WX_VERSION: v3.3.3

  # Must reach the app build too, not only wxWidgets.
  MACOS_MIN: "11.0"

  WX_TRIM: >-
    --disable-html --disable-xrc --disable-sockets
    --disable-aui --disable-stc --disable-richtext --disable-propgrid
    --disable-ribbon --disable-mediactrl --disable-webview
    --disable-debugreport --without-opengl

jobs:
  macos:
    name: macos-universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Split from save so a later failure does not discard a built wxWidgets.
      - name: Restore the static wxWidgets build
        id: wxcache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: wx-install
          key: wx-${{ env.WX_VERSION }}-macos14-universal-static-v3

      # =builtin: Homebrew ships single-arch libs, which break the universal link.
      - name: Build wxWidgets as a static universal library
        id: wxbuild
        if: steps.wxcache.outputs.cache-hit != 'true'
        run: |
          set -eux
          git clone --depth 1 --branch "$WX_VERSION" --recurse-submodules \
            https://github.com/wxWidgets/wxWidgets.git wx-src
          mkdir wx-build && cd wx-build
          ../wx-src/configure \
            --prefix="$GITHUB_WORKSPACE/wx-install" \
            --disable-shared \
            --disable-tests \
            $WX_TRIM \
            --with-osx_cocoa \
            --with-macosx-version-min=$MACOS_MIN \
            --enable-universal_binary=x86_64,arm64 \
            --with-libjpeg=builtin \
            --with-libpng=builtin \
            --with-libtiff=builtin \
            --with-zlib=builtin \
            --with-regex=builtin \
            --with-expat=builtin \
            --without-libwebp \
            --without-subdirs
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Save the static wxWidgets build
        if: steps.wxbuild.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: wx-install
          key: wx-${{ env.WX_VERSION }}-macos14-universal-static-v3

      - name: Build SevenuP.app
        run: |
          set -eux
          cd SRC
          make -f makefile.osx WX_CONFIG="$GITHUB_WORKSPACE/wx-install/bin/wx-config" \
            ARCHFLAGS="-arch x86_64 -arch arm64" \
            MACOS_MIN="$MACOS_MIN"

      - name: Check the app is self-contained, and both architectures are in it
        run: |
          set -eu
          bin=SRC/SevenuP.app/Contents/MacOS/SevenuP
          echo "--- architectures ---"
          lipo -info "$bin"
          lipo -info "$bin" | grep -q 'x86_64' || { echo "::error::no x86_64 slice"; exit 1; }
          lipo -info "$bin" | grep -q 'arm64'  || { echo "::error::no arm64 slice";  exit 1; }
          echo "--- oldest macOS it will start on ---"
          otool -l "$bin" | grep -A3 LC_BUILD_VERSION | grep minos | sort -u
          bad=$(otool -l "$bin" | grep -A3 LC_BUILD_VERSION | grep minos \
                | grep -vc "minos $MACOS_MIN" || true)
          [ "$bad" = "0" ] || { echo "::error::a slice does not target $MACOS_MIN"; exit 1; }

          echo "--- what it asks the loader for ---"
          otool -L "$bin"
          if otool -L "$bin" | grep -E '^[[:space:]]+/' | \
             grep -vE '^[[:space:]]+(/usr/lib/|/System/Library/)'; then
            echo "::error::the binary links something outside /usr/lib and /System/Library"
            exit 1
          fi
          echo "self-contained: only system libraries and frameworks"

      - name: Run it
        run: |
          set -eu
          python3 - <<'PY'
          b = bytearray(6912)
          for i in range(6144): b[i] = (i * 7) & 0xFF
          for i in range(768):  b[6144 + i] = (i % 8) | (((i // 32) % 8) << 3)
          open('smoke.scr', 'wb').write(b)
          PY
          SRC/SevenuP.app/Contents/MacOS/SevenuP "$PWD/smoke.scr" &
          pid=$!
          sleep 10
          if kill -0 "$pid" 2>/dev/null; then
            echo "still running after 10s"
            kill "$pid"
          else
            wait "$pid" && rc=0 || rc=$?
            echo "::error::it exited on its own with status $rc"
            exit 1
          fi

      # ditto: artifact upload drops the executable bit and symlinks.
      - name: Archive the bundle
        run: ditto -c -k --sequesterRsrc --keepParent SRC/SevenuP.app SevenuP-macos-universal.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SevenuP-macos-universal
          path: SevenuP-macos-universal.zip
          if-no-files-found: error

  linux:
    name: linux-x86_64
    # Pinned: the runner glibc becomes the AppImage floor.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install the GTK headers wxWidgets builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev imagemagick file desktop-file-utils

      # Split from save so a later failure does not discard a built wxWidgets.
      - name: Restore the static wxWidgets build
        id: wxcache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: wx-install
          key: wx-${{ env.WX_VERSION }}-ubuntu2204-gtk3-static-v2

      - name: Build wxWidgets as a static library
        id: wxbuild
        if: steps.wxcache.outputs.cache-hit != 'true'
        run: |
          set -eux
          git clone --depth 1 --branch "$WX_VERSION" --recurse-submodules \
            https://github.com/wxWidgets/wxWidgets.git wx-src
          mkdir wx-build && cd wx-build
          ../wx-src/configure \
            --prefix="$GITHUB_WORKSPACE/wx-install" \
            --disable-shared \
            --disable-tests \
            $WX_TRIM \
            --with-gtk=3 \
            --without-subdirs
          make -j"$(nproc)"
          make install

      - name: Save the static wxWidgets build
        if: steps.wxbuild.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: wx-install
          key: wx-${{ env.WX_VERSION }}-ubuntu2204-gtk3-static-v2

      - name: Build SevenuP
        run: |
          set -eux
          cd SRC
          make -f makefile.unx WX_CONFIG="$GITHUB_WORKSPACE/wx-install/bin/wx-config"
          file SevenuP

      - name: Stage an AppDir
        run: |
          set -eux
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/32x32/apps
          cp SRC/SevenuP AppDir/usr/bin/
          convert SRC/bitmaps/sevenup.xpm \
            AppDir/usr/share/icons/hicolor/32x32/apps/sevenup.png
          cat > AppDir/usr/share/applications/sevenup.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=SevenuP
          Comment=ZX Spectrum graphic editor
          Exec=SevenuP %F
          Icon=sevenup
          Categories=Graphics;2DGraphics;RasterGraphics;
          MimeType=application/x-spectrum-screen;
          Terminal=false
          DESKTOP
          desktop-file-validate AppDir/usr/share/applications/sevenup.desktop

      # Host GIO modules are built against a newer glib and fail to load.
      - name: Keep glib away from the host's GIO modules
        run: |
          set -eux
          mkdir -p AppDir/apprun-hooks AppDir/usr/lib/gio/modules
          cat > AppDir/apprun-hooks/gio-modules.sh <<'HOOK'
          export GIO_MODULE_DIR="$APPDIR/usr/lib/gio/modules"
          HOOK

      - name: Build the AppImage
        run: |
          set -eux
          base=https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous
          curl -fsSL -o linuxdeploy "$base/linuxdeploy-x86_64.AppImage"
          curl -fsSL -o linuxdeploy-plugin-gtk \
            https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy linuxdeploy-plugin-gtk
          export APPIMAGE_EXTRACT_AND_RUN=1
          export DEPLOY_GTK_VERSION=3
          ./linuxdeploy --appdir AppDir --plugin gtk --output appimage \
            -d AppDir/usr/share/applications/sevenup.desktop \
            -i AppDir/usr/share/icons/hicolor/32x32/apps/sevenup.png
          mv SevenuP*.AppImage SevenuP-linux-x86_64.AppImage
          chmod +x SevenuP-linux-x86_64.AppImage

      - name: Check the AppImage carries its dependencies
        run: |
          set -eu
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./SevenuP-linux-x86_64.AppImage --appimage-extract >/dev/null
          echo "--- bundled libraries ---"
          ls squashfs-root/usr/lib/ | head -40
          for lib in libgtk-3 libgdk-3 libglib-2.0; do
            ls squashfs-root/usr/lib/ | grep -q "$lib" || {
              echo "::error::$lib is not bundled; the AppImage needs it installed"; exit 1; }
          done
          if ls squashfs-root/usr/lib/ | grep -i '^libwx'; then
            echo "::error::wxWidgets is bundled as a shared library, so it was not linked statically"
            exit 1
          fi
          echo "self-contained: GTK bundled, wxWidgets linked in"

      - name: Run it
        run: |
          set -eu
          sudo apt-get install -y xvfb
          export APPIMAGE_EXTRACT_AND_RUN=1
          python3 - <<'PY'
          b = bytearray(6912)
          for i in range(6144): b[i] = (i * 7) & 0xFF
          for i in range(768):  b[6144 + i] = (i % 8) | (((i // 32) % 8) << 3)
          open('smoke.scr', 'wb').write(b)
          PY
          xvfb-run -a ./SevenuP-linux-x86_64.AppImage "$PWD/smoke.scr" &
          pid=$!
          sleep 15
          if kill -0 "$pid" 2>/dev/null; then
            echo "still running after 15s"
            kill "$pid"
          else
            wait "$pid" && rc=0 || rc=$?
            echo "::error::it exited on its own with status $rc"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SevenuP-linux-x86_64
          path: SevenuP-linux-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: windows-x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf

      # Split from save so a later failure does not discard a built wxWidgets.
      - name: Restore the static wxWidgets build
        id: wxcache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: wx-install
          key: wx-${{ env.WX_VERSION }}-mingw64-static-v2

      - name: Build wxWidgets as a static library
        id: wxbuild
        if: steps.wxcache.outputs.cache-hit != 'true'
        run: |
          set -eux
          git clone --depth 1 --branch "$WX_VERSION" --recurse-submodules \
            https://github.com/wxWidgets/wxWidgets.git wx-src
          mkdir wx-build && cd wx-build
          ../wx-src/configure \
            --prefix="$(cygpath -u "$GITHUB_WORKSPACE")/wx-install" \
            --disable-shared \
            --disable-tests \
            $WX_TRIM \
            --without-subdirs
          make -j"$(nproc)"
          make install

      - name: Save the static wxWidgets build
        if: steps.wxbuild.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: wx-install
          key: wx-${{ env.WX_VERSION }}-mingw64-static-v2

      - name: Build SevenuP.exe
        run: |
          set -eux
          cd SRC
          WXC="$(cygpath -u "$GITHUB_WORKSPACE")/wx-install/bin/wx-config"
          make -f makefile.mingw \
            WX_CONFIG="$WXC" \
            WX_RCFLAGS="$($WXC --cppflags)"
          file SevenuP.exe

      - name: Check the .exe is self-contained
        run: |
          set -eu
          cd SRC
          echo "--- DLLs it will look for ---"
          objdump -p SevenuP.exe | grep 'DLL Name:' | sort -u
          if objdump -p SevenuP.exe | grep 'DLL Name:' | \
             grep -iE 'libwx|libgcc|libstdc\+\+|libwinpthread'; then
            echo "::error::the .exe needs a non-system DLL beside it"
            exit 1
          fi
          echo "self-contained: system DLLs only"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SevenuP-windows-x86_64
          path: SRC/SevenuP.exe
          if-no-files-found: error

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Not applied to release runs: a push must not kill a build that is publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  WX_VERSION: v3.3.3

  # arm64 cannot go below 11.0; clang clamps older targets. Intel can.
  MACOS_MIN_INTEL: "10.13"
  MACOS_MIN_ARM: "11.0"

  WX_TRIM: >-
    --disable-html --disable-xrc --disable-sockets
    --disable-aui --disable-stc --disable-richtext --disable-propgrid
    --disable-ribbon --disable-mediactrl --disable-webview
    --disable-debugreport --without-opengl

jobs:
  macos:
    name: macos-universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Split from save so a later failure does not discard a built wxWidgets.
      - name: Restore the static wxWidgets build
        id: wxcache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: wx-install
          key: wx-${{ env.WX_VERSION }}-macos14-universal-static-min${{ env.MACOS_MIN_INTEL }}-v4

      # =builtin: Homebrew ships single-arch libs, which break the universal link.
      - name: Build wxWidgets as a static universal library
        id: wxbuild
        if: steps.wxcache.outputs.cache-hit != 'true'
        run: |
          set -eux
          git clone --depth 1 --branch "$WX_VERSION" --recurse-submodules \
            https://github.com/wxWidgets/wxWidgets.git wx-src
          mkdir wx-build && cd wx-build
          ../wx-src/configure \
            --prefix="$GITHUB_WORKSPACE/wx-install" \
            --disable-shared \
            --disable-tests \
            $WX_TRIM \
            --with-osx_cocoa \
            --with-macosx-version-min=$MACOS_MIN_INTEL \
            --enable-universal_binary=x86_64,arm64 \
            --with-libjpeg=builtin \
            --with-libpng=builtin \
            --with-libtiff=builtin \
            --with-zlib=builtin \
            --with-regex=builtin \
            --with-expat=builtin \
            --without-libwebp \
            --without-subdirs
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Save the static wxWidgets build
        if: steps.wxbuild.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: wx-install
          key: wx-${{ env.WX_VERSION }}-macos14-universal-static-min${{ env.MACOS_MIN_INTEL }}-v4

      # One compile carries one deployment target, so each slice is built separately.
      - name: Build SevenuP, once per architecture, then lipo them together
        run: |
          set -eux
          cd SRC
          WXC="$GITHUB_WORKSPACE/wx-install/bin/wx-config"

          make -f makefile.osx clean
          make -f makefile.osx SevenuP WX_CONFIG="$WXC" \
            ARCHFLAGS="-arch x86_64" MACOS_MIN="$MACOS_MIN_INTEL"
          mv SevenuP ../SevenuP.x86_64

          make -f makefile.osx clean
          make -f makefile.osx SevenuP WX_CONFIG="$WXC" \
            ARCHFLAGS="-arch arm64" MACOS_MIN="$MACOS_MIN_ARM"
          mv SevenuP ../SevenuP.arm64

          lipo -create ../SevenuP.x86_64 ../SevenuP.arm64 -output SevenuP
          lipo -info SevenuP

          make -f makefile.osx bundle

      - name: Check the app is self-contained, and both architectures are in it
        run: |
          set -eu
          bin=SRC/SevenuP.app/Contents/MacOS/SevenuP
          echo "--- architectures ---"
          lipo -info "$bin"
          lipo -info "$bin" | grep -q 'x86_64' || { echo "::error::no x86_64 slice"; exit 1; }
          lipo -info "$bin" | grep -q 'arm64'  || { echo "::error::no arm64 slice";  exit 1; }
          echo "--- oldest macOS each slice will start on ---"
          for a in x86_64:"$MACOS_MIN_INTEL" arm64:"$MACOS_MIN_ARM"; do
            arch=${a%%:*}; want=${a##*:}
            lipo -thin "$arch" "$bin" -output /tmp/slice.$arch
            got=$(otool -l /tmp/slice.$arch \
                  | grep -A3 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' \
                  | grep -E '^\s+(minos|version) ' | awk '{print $2}' | head -1)
            echo "  $arch -> $got (wanted $want)"
            [ "$got" = "$want" ] || {
              echo "::error::$arch targets $got, not $want"; exit 1; }
          done

          echo "--- what it asks the loader for ---"
          otool -L "$bin"
          if otool -L "$bin" | grep -E '^[[:space:]]+/' | \
             grep -vE '^[[:space:]]+(/usr/lib/|/System/Library/)'; then
            echo "::error::the binary links something outside /usr/lib and /System/Library"
            exit 1
          fi
          echo "self-contained: only system libraries and frameworks"

      - name: Run it
        run: |
          set -eu
          python3 - <<'PY'
          b = bytearray(6912)
          for i in range(6144): b[i] = (i * 7) & 0xFF
          for i in range(768):  b[6144 + i] = (i % 8) | (((i // 32) % 8) << 3)
          open('smoke.scr', 'wb').write(b)
          PY
          SRC/SevenuP.app/Contents/MacOS/SevenuP "$PWD/smoke.scr" &
          pid=$!
          sleep 10
          if kill -0 "$pid" 2>/dev/null; then
            echo "still running after 10s"
            kill "$pid"
          else
            wait "$pid" && rc=0 || rc=$?
            echo "::error::it exited on its own with status $rc"
            exit 1
          fi

      # ditto: artifact upload drops the executable bit and symlinks.
      - name: Archive the bundle
        run: ditto -c -k --sequesterRsrc --keepParent SRC/SevenuP.app SevenuP-macos-universal.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SevenuP-macos-universal
          path: SevenuP-macos-universal.zip
          if-no-files-found: error

  linux:
    name: linux-x86_64
    # Pinned: the runner glibc becomes the AppImage floor.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # librsvg2-common: without it GTK cannot draw the SVG icons that
      # modern themes ship.
      - name: Install the GTK headers wxWidgets builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev imagemagick file \
            desktop-file-utils librsvg2-common zlib1g-dev liblzma-dev xvfb

      # libxml2 is bundled only so librsvg can parse SVG icons, and the distro
      # build of it links ICU, whose data blob is 11 MB. /usr/local resolves
      # ahead of the system copy, so the dependency walk never reaches ICU.
      - name: Build libxml2 without ICU
        run: |
          set -eux
          curl -fsSL -o libxml2.tar.xz \
            https://download.gnome.org/sources/libxml2/2.9/libxml2-2.9.14.tar.xz
          echo "60d74a257d1ccec0475e749cba2f21559e48139efba6ff28224357c7c798dfee  libxml2.tar.xz" \
            | sha256sum -c -
          tar xf libxml2.tar.xz
          cd libxml2-2.9.14
          ./configure --prefix=/usr/local --without-icu --without-python \
            --disable-static --enable-shared
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          ldd /usr/lib/x86_64-linux-gnu/librsvg-2.so.2 | grep libxml2
          if ldd /usr/lib/x86_64-linux-gnu/librsvg-2.so.2 | grep -q libicu; then
            echo "::error::librsvg still resolves an ICU-linked libxml2"
            exit 1
          fi

      # Split from save so a later failure does not discard a built wxWidgets.
      - name: Restore the static wxWidgets build
        id: wxcache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: wx-install
          key: wx-${{ env.WX_VERSION }}-ubuntu2204-gtk3-static-v2

      - name: Build wxWidgets as a static library
        id: wxbuild
        if: steps.wxcache.outputs.cache-hit != 'true'
        run: |
          set -eux
          git clone --depth 1 --branch "$WX_VERSION" --recurse-submodules \
            https://github.com/wxWidgets/wxWidgets.git wx-src
          mkdir wx-build && cd wx-build
          ../wx-src/configure \
            --prefix="$GITHUB_WORKSPACE/wx-install" \
            --disable-shared \
            --disable-tests \
            $WX_TRIM \
            --with-gtk=3 \
            --without-subdirs
          make -j"$(nproc)"
          make install

      - name: Save the static wxWidgets build
        if: steps.wxbuild.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: wx-install
          key: wx-${{ env.WX_VERSION }}-ubuntu2204-gtk3-static-v2

      - name: Build SevenuP
        run: |
          set -eux
          cd SRC
          make -f makefile.unx LDFLAGS=-s \
            WX_CONFIG="$GITHUB_WORKSPACE/wx-install/bin/wx-config"
          file SevenuP

      - name: Stage an AppDir
        run: |
          set -eux
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/32x32/apps
          cp SRC/SevenuP AppDir/usr/bin/
          convert SRC/bitmaps/sevenup.xpm \
            AppDir/usr/share/icons/hicolor/32x32/apps/sevenup.png
          cat > AppDir/usr/share/applications/sevenup.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=SevenuP
          Comment=ZX Spectrum graphic editor
          Exec=SevenuP %F
          Icon=sevenup
          Categories=Graphics;2DGraphics;RasterGraphics;
          MimeType=application/x-spectrum-screen;
          Terminal=false
          DESKTOP
          desktop-file-validate AppDir/usr/share/applications/sevenup.desktop

      # Host GIO modules are built against a newer glib and fail to load.
      - name: Keep glib away from the host's GIO modules
        run: |
          set -eux
          mkdir -p AppDir/apprun-hooks AppDir/usr/lib/gio/modules
          cat > AppDir/apprun-hooks/gio-modules.sh <<'HOOK'
          export GIO_MODULE_DIR="$APPDIR/usr/lib/gio/modules"
          HOOK

      # Staging only: packaging runs after the prune, so linuxdeploy cannot
      # put back what the next step takes out.
      - name: Fill the AppDir with GTK and its dependencies
        run: |
          set -eux
          base=https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous
          curl -fsSL -o linuxdeploy "$base/linuxdeploy-x86_64.AppImage"
          curl -fsSL -o linuxdeploy-plugin-gtk \
            https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy linuxdeploy-plugin-gtk
          export APPIMAGE_EXTRACT_AND_RUN=1
          export DEPLOY_GTK_VERSION=3
          ./linuxdeploy --appdir AppDir --plugin gtk \
            -d AppDir/usr/share/applications/sevenup.desktop \
            -i AppDir/usr/share/icons/hicolor/32x32/apps/sevenup.png

      - name: Drop what SevenuP cannot use
        run: |
          set -eux
          # Nothing in the bundle links libgirepository; the GTK plugin stages
          # the typelibs whether or not anything introspects.
          rm -rf AppDir/usr/lib/girepository-1.0
          python3 - AppDir <<'PRUNE'
          import os, subprocess, sys

          appdir = sys.argv[1]
          libdir = os.path.join(appdir, 'usr/lib')

          # SevenuP has no wxPrint* anywhere in it, so the CUPS backend and
          # the TLS, Kerberos and Avahi stack behind it are dead weight. The
          # GTK plugin stages the backend under two names.
          DROP = ('libprintbackend-cups.so',)

          # Modules are dlopened, so nothing ever lists them as NEEDED. They are
          # roots of the dependency graph in their own right, like the binary.
          MODULES = ('libpixbufloader-', 'libprintbackend-', 'im-')

          def dynamic(path):
              """(soname, [needed]) for an ELF, None for anything else."""
              out = subprocess.run(['objdump', '-p', path], capture_output=True,
                                   text=True, errors='replace').stdout
              if 'Dynamic Section' not in out:
                  return None
              soname, needed = None, []
              for line in out.splitlines():
                  f = line.split()
                  if f[:1] == ['SONAME']:
                      soname = f[1]
                  elif f[:1] == ['NEEDED']:
                      needed.append(f[1])
              return soname, needed

          libs, roots, doomed = {}, [], []
          for base, _, names in os.walk(appdir):
              for n in names:
                  p = os.path.join(base, n)
                  if os.path.islink(p) or not os.path.isfile(p):
                      continue
                  d = dynamic(p)
                  if d is None:
                      continue
                  soname, needed = d
                  if n in DROP:
                      doomed.append((p, needed))
                  elif os.path.dirname(p) == libdir and soname \
                          and not n.startswith(MODULES):
                      libs.setdefault(soname, []).append((p, needed))
                  else:
                      roots.append((p, needed))

          def reachable(entries):
              seen, queue = set(), [n for _, needed in entries for n in needed]
              while queue:
                  s = queue.pop()
                  if s in seen or s not in libs:
                      continue
                  seen.add(s)
                  for _, needed in libs[s]:
                      queue.extend(needed)
              return seen

          # Only what the doomed modules alone keep alive. A library that
          # already looks unreferenced stays: its users are host libraries
          # linuxdeploy omits on purpose, so this graph has holes in it.
          orphaned = reachable(roots + doomed) - reachable(roots)

          for p, _ in doomed + [e for s in sorted(orphaned) for e in libs[s]]:
              print('dropping', os.path.relpath(p, appdir))
              os.remove(p)

          # Whatever pointed at them is a dangling symlink now.
          for base, _, names in os.walk(appdir):
              for n in names:
                  p = os.path.join(base, n)
                  if os.path.islink(p) and not os.path.exists(p):
                      os.remove(p)
          PRUNE

      - name: Build the AppImage
        run: |
          set -eux
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSL -o runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          chmod +x appimagetool
          export APPIMAGE_EXTRACT_AND_RUN=1
          export ARCH=x86_64
          # Level 22 rather than the zstd default of 15. The block size is
          # left alone: appimagetool's 128K is what keeps startup quick.
          ./appimagetool --no-appstream --runtime-file runtime-x86_64 \
            --mksquashfs-opt=-Xcompression-level --mksquashfs-opt=22 \
            AppDir SevenuP-linux-x86_64.AppImage
          chmod +x SevenuP-linux-x86_64.AppImage
          ls -l SevenuP-linux-x86_64.AppImage

      - name: Check the AppImage carries its dependencies, and nothing more
        run: |
          set -eu
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./SevenuP-linux-x86_64.AppImage --appimage-extract >/dev/null
          echo "--- bundled libraries ---"
          ls squashfs-root/usr/lib/
          for lib in libgtk-3 libgdk-3 libglib-2.0 libxml2 librsvg-2; do
            ls squashfs-root/usr/lib/ | grep -q "$lib" || {
              echo "::error::$lib is not bundled; the AppImage needs it installed"; exit 1; }
          done
          if ls squashfs-root/usr/lib/ | grep -i '^libwx'; then
            echo "::error::wxWidgets is bundled as a shared library, so it was not linked statically"
            exit 1
          fi
          if ls squashfs-root/usr/lib/ | grep -iE '^libicu|^libcups|^libgnutls|^libkrb5'; then
            echo "::error::ICU or the print stack is back in the bundle"
            exit 1
          fi
          echo "self-contained: GTK bundled, wxWidgets linked in, no ICU, no print stack"

          echo "--- oldest glibc it will run against ---"
          floor=GLIBC_2.35
          want=$(objdump -T squashfs-root/usr/bin/SevenuP squashfs-root/usr/lib/*.so* 2>/dev/null \
                 | grep -oE 'GLIBC_2\.[0-9]+' | sort -uV | tail -1)
          echo "  needs at most $want, floor is $floor"
          if [ "$(printf '%s\n%s\n' "$want" "$floor" | sort -V | tail -1)" != "$floor" ]; then
            echo "::error::something needs $want, above the $floor floor"
            exit 1
          fi

      - name: Run it
        run: |
          set -eu
          export APPIMAGE_EXTRACT_AND_RUN=1
          python3 - <<'PY'
          b = bytearray(6912)
          for i in range(6144): b[i] = (i * 7) & 0xFF
          for i in range(768):  b[6144 + i] = (i % 8) | (((i // 32) % 8) << 3)
          open('smoke.scr', 'wb').write(b)
          PY
          xvfb-run -a ./SevenuP-linux-x86_64.AppImage "$PWD/smoke.scr" &
          pid=$!
          sleep 15
          if kill -0 "$pid" 2>/dev/null; then
            echo "still running after 15s"
            kill "$pid"
          else
            wait "$pid" && rc=0 || rc=$?
            echo "::error::it exited on its own with status $rc"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SevenuP-linux-x86_64
          path: SevenuP-linux-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: windows-x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf

      # Split from save so a later failure does not discard a built wxWidgets.
      - name: Restore the static wxWidgets build
        id: wxcache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: wx-install
          key: wx-${{ env.WX_VERSION }}-mingw64-static-v2

      - name: Build wxWidgets as a static library
        id: wxbuild
        if: steps.wxcache.outputs.cache-hit != 'true'
        run: |
          set -eux
          git clone --depth 1 --branch "$WX_VERSION" --recurse-submodules \
            https://github.com/wxWidgets/wxWidgets.git wx-src
          mkdir wx-build && cd wx-build
          ../wx-src/configure \
            --prefix="$(cygpath -u "$GITHUB_WORKSPACE")/wx-install" \
            --disable-shared \
            --disable-tests \
            $WX_TRIM \
            --without-subdirs
          make -j"$(nproc)"
          make install

      - name: Save the static wxWidgets build
        if: steps.wxbuild.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: wx-install
          key: wx-${{ env.WX_VERSION }}-mingw64-static-v2

      - name: Build SevenuP.exe
        run: |
          set -eux
          cd SRC
          WXC="$(cygpath -u "$GITHUB_WORKSPACE")/wx-install/bin/wx-config"
          make -f makefile.mingw \
            WX_CONFIG="$WXC" \
            WX_RCFLAGS="$($WXC --cppflags)"
          file SevenuP.exe

      - name: Check the .exe is self-contained
        run: |
          set -eu
          cd SRC
          echo "--- DLLs it will look for ---"
          objdump -p SevenuP.exe | grep 'DLL Name:' | sort -u
          if objdump -p SevenuP.exe | grep 'DLL Name:' | \
             grep -iE 'libwx|libgcc|libstdc\+\+|libwinpthread'; then
            echo "::error::the .exe needs a non-system DLL beside it"
            exit 1
          fi
          echo "self-contained: system DLLs only"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SevenuP-windows-x86_64
          path: SRC/SevenuP.exe
          if-no-files-found: error
